name: Windows Package

on:
  push:
    branches:
      - main
      - master
      - win64
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build Windows package
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    env:
      GENSIO_REF: 0a00359305f211dbe844ec7eaa6962c7f1af52b1

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: minimal
          install: >-
            git
            base-devel
            autoconf
            automake
            libtool
            make
            pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libyaml
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build portable folder
        shell: msys2 {0}
        run: bash scripts/build-windows-package.sh

      - name: Prepare package variants
        run: |
          Remove-Item -Recurse -Force dist\Ser2Net-framework, dist\Ser2Net-runtime -ErrorAction SilentlyContinue
          Copy-Item -Recurse dist\Ser2Net dist\Ser2Net-framework
          Copy-Item -Recurse dist\Ser2Net dist\Ser2Net-runtime

      - name: Publish Windows service and tray tools without .NET runtime
        run: |
          dotnet publish windows\Ser2Net.Service\Ser2Net.Service.csproj `
            -c Release `
            -p:Platform=x64 `
            -r win-x64 `
            --self-contained false `
            -o dist\Ser2Net-framework\bin
          dotnet publish windows\Ser2Net.Tray\Ser2Net.Tray.csproj `
            -c Release `
            -p:Platform=x64 `
            -r win-x64 `
            --self-contained false `
            -o dist\Ser2Net-framework\bin
          dist\Ser2Net-framework\bin\Ser2Net.Service.exe generate --root dist\Ser2Net-framework

      - name: Publish Windows service and tray tools with .NET runtime
        run: |
          dotnet publish windows\Ser2Net.Service\Ser2Net.Service.csproj `
            -c Release `
            -p:Platform=x64 `
            -r win-x64 `
            --self-contained true `
            -o dist\Ser2Net-runtime\bin
          dotnet publish windows\Ser2Net.Tray\Ser2Net.Tray.csproj `
            -c Release `
            -p:Platform=x64 `
            -r win-x64 `
            --self-contained true `
            -o dist\Ser2Net-runtime\bin
          dist\Ser2Net-runtime\bin\Ser2Net.Service.exe generate --root dist\Ser2Net-runtime

      - name: Validate package variants
        run: |
          $variants = @("dist\Ser2Net-framework", "dist\Ser2Net-runtime")
          foreach ($variant in $variants) {
            $required = @(
              "$variant\bin\ser2net.exe",
              "$variant\bin\Ser2Net.Service.exe",
              "$variant\bin\Ser2Net.Tray.exe",
              "$variant\etc\ser2net\mappings.json",
              "$variant\etc\ser2net\windows.yml",
              "$variant\etc\ser2net\smoke-echo.yaml",
              "$variant\docs\dll-inventory.txt"
            )
            foreach ($path in $required) {
              if (-not (Test-Path $path)) {
                throw "Required package file is missing: $path"
              }
            }
          }
          if (Test-Path "dist\Ser2Net-framework\bin\coreclr.dll") {
            throw "Framework-dependent package unexpectedly contains .NET runtime files."
          }
          if (-not (Test-Path "dist\Ser2Net-runtime\bin\coreclr.dll")) {
            throw "Runtime package is missing bundled .NET runtime files."
          }
          Get-ChildItem dist\Ser2Net-framework -Recurse | Select-Object FullName, Length
          Get-ChildItem dist\Ser2Net-runtime -Recurse | Select-Object FullName, Length

      - name: Read package version
        id: version
        run: |
          $configure = Get-Content configure.ac -Raw
          if ($configure -notmatch 'AC_INIT\(\[ser2net\],\[(?<version>[^\]]+)\]') {
            throw "Unable to read ser2net version from configure.ac"
          }
          "value=$($Matches.version)" >> $env:GITHUB_OUTPUT

      - name: Build Inno Setup installers
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = "${{ steps.version.outputs.value }}"
          & $iscc "/DMyAppVersion=$version" "/DSourceDir=dist\Ser2Net-framework" "/DMyOutputBaseFilename=Ser2Net-$version-win64" ser2net.iss
          & $iscc "/DMyAppVersion=$version" "/DSourceDir=dist\Ser2Net-runtime" "/DMyOutputBaseFilename=Ser2Net-$version-win64-runtime" ser2net.iss

      - name: Build portable zips
        run: |
          $version = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist\installer | Out-Null
          Compress-Archive `
            -Path dist\Ser2Net-framework\* `
            -DestinationPath "dist\installer\Ser2Net-$version-win64-portable.zip" `
            -Force
          Compress-Archive `
            -Path dist\Ser2Net-runtime\* `
            -DestinationPath "dist\installer\Ser2Net-$version-win64-runtime-portable.zip" `
            -Force

      - name: Upload Windows package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ser2Net-${{ steps.version.outputs.value }}-win64
          path: |
            dist/installer/Ser2Net-${{ steps.version.outputs.value }}-win64.exe
            dist/installer/Ser2Net-${{ steps.version.outputs.value }}-win64-runtime.exe
            dist/installer/Ser2Net-${{ steps.version.outputs.value }}-win64-portable.zip
            dist/installer/Ser2Net-${{ steps.version.outputs.value }}-win64-runtime-portable.zip
            dist/Ser2Net-framework/docs/dll-inventory.txt
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/Ser2Net-${{ steps.version.outputs.value }}-win64.exe
            dist/installer/Ser2Net-${{ steps.version.outputs.value }}-win64-runtime.exe
            dist/installer/Ser2Net-${{ steps.version.outputs.value }}-win64-portable.zip
            dist/installer/Ser2Net-${{ steps.version.outputs.value }}-win64-runtime-portable.zip
